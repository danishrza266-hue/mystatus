<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1b2d">
<title>My Status</title>
<style>
:root{--bg:#0f1b2d;--card:#182840;--ink:#eaf0f7;--mute:#8fa3bd;--glow:#ffb347;--ok:#5ed39a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;min-height:100vh}
.wrap{max-width:440px;margin:0 auto;padding:20px 18px 60px}
h1{font-size:22px;margin:8px 0 18px}
input,button,select{font:inherit;border-radius:12px;border:1px solid #2c4263;background:var(--card);color:var(--ink);padding:13px 14px;width:100%;margin-bottom:10px}
button{background:var(--glow);color:#1b1200;border:0;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid #2c4263;font-weight:500}
.person{text-align:center;margin:22px 0 30px}
.bubble{display:inline-block;max-width:92%;background:var(--card);border:1px solid #2c4263;border-radius:16px;padding:12px 16px;font-size:17px;line-height:1.4;position:relative;margin-bottom:16px;word-break:break-word}
.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:var(--card);border-right:1px solid #2c4263;border-bottom:1px solid #2c4263;transform:translateX(-50%) rotate(45deg)}
.bubble.empty{color:var(--mute)}
.circle{width:128px;height:128px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;background:#21395c;border:4px solid var(--glow);box-shadow:0 0 34px rgba(255,179,71,.35)}
.circle{overflow:hidden;cursor:pointer}
.circle.sm{cursor:default}
.circle img{width:100%;height:100%;object-fit:cover;display:block}
.circle.sm{width:92px;height:92px;font-size:36px;border-color:var(--ok);box-shadow:0 0 22px rgba(94,211,154,.25)}
.name{margin-top:12px;font-size:18px;font-weight:600}
.time{color:var(--mute);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chips span{background:var(--card);border:1px solid #2c4263;border-radius:99px;padding:8px 13px;font-size:14px;cursor:pointer}
h2{font-size:16px;color:var(--mute);font-weight:500;margin:30px 0 4px}
.code{background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0;color:var(--mute);font-size:14px}
.code b{color:var(--glow);font-size:20px;letter-spacing:3px}
.req{background:var(--card);border:1px solid var(--glow);border-radius:14px;padding:12px 14px;margin:12px 0}
.req .btns{display:flex;gap:8px}
.req .btns button{margin:10px 0 0}
.row{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0}
.row .circle{width:56px;height:56px;font-size:24px;border-width:3px;margin:0;flex:none;box-shadow:none}
.row .info{min-width:0;flex:1}
.row .n{font-weight:600}
.row .s{word-break:break-word}
.row .s.empty{color:var(--mute)}
.row .t{color:var(--mute);font-size:12px;margin-top:2px}
.row button{width:auto;margin:0;padding:8px 12px;font-size:13px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<div id="loginView" class="hide">
  <h1>My Status</h1>
  <input id="nm" placeholder="Your name (only for a new account)">
  <input id="em" type="email" placeholder="Email">
  <input id="pw" type="password" placeholder="Password (at least 6 characters)">
  <button id="loginBtn">Log in</button>
  <button id="signupBtn" class="ghost">Create new account</button>
</div>

<div id="mainView" class="hide">
  <div class="person">
    <div class="bubble" id="myBubble"></div>
    <div class="circle" id="myCircle"></div>
    <div class="name" id="myName"></div>
    <div class="time" id="myTime"></div>
    <div class="time">Tap the circle to set a photo</div>
    <input type="file" id="pf" accept="image/*" class="hide">
  </div>

  <input id="st" maxlength="200" placeholder="What are you doing right now?">
  <select id="dur">
    <option value="60">Show for 1 hour</option>
    <option value="180">Show for 3 hours</option>
    <option value="480" selected>Show for 8 hours</option>
    <option value="1440">Show for 24 hours</option>
    <option value="0">Until I change it</option>
  </select>
  <div class="chips" id="chips"></div>
  <button id="saveBtn">Save status</button>
  <div id="requests"></div>

  <div id="others"></div>

  <h2>Connect with someone</h2>
  <input id="fc" maxlength="6" placeholder="Their 6-character code">
  <button id="addBtn">Send request</button>
  <div class="code">Your code: <b id="myCode">------</b><br>Share this code with your family. When someone enters it, you get a request. After you approve, you can see each other's status.</div>
  <button class="ghost" id="outBtn">Log out</button>
</div>

</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase,ref,get,set,update,remove,onValue} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDL8nJnqWml4r12w1LusgI6bqBmaesIu6Y",
  authDomain: "mystatus-128f6.firebaseapp.com",
  databaseURL: "https://mystatus-128f6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mystatus-128f6",
  storageBucket: "mystatus-128f6.firebasestorage.app",
  messagingSenderId: "739510969973",
  appId: "1:739510969973:web:205c9a5cfc1e6f8bd0fa3c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const QUICK = ["Sleeping 😴","Out for a walk 🚶","At work 💼","Eating 🍽️","Free, you can call 📞"];

function ago(t){
  if(!t) return "";
  const m = Math.floor((Date.now()-t)/60000);
  if(m < 1) return "Just now";
  if(m < 60) return m+" min ago";
  if(m < 1440) return Math.floor(m/60)+" hr ago";
  return Math.floor(m/1440)+" days ago";
}
const avatar = o => /^data:image\//.test(o.photo||"") ? `<img src="${o.photo}" alt="">` : esc(initial(o.name));
const live = o => (o.status && (!o.expires || Date.now() < o.expires)) ? o.status : "";
const initial = n => (n||"?").trim().charAt(0).toUpperCase();
const errMsg = e => ({
  "auth/invalid-credential":"Wrong email or password",
  "auth/email-already-in-use":"This email is already registered, please log in",
  "auth/weak-password":"Password must be at least 6 characters",
  "auth/invalid-email":"Email is not valid",
  "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"Invalid apiKey"
}[e.code] || ("Error: "+(e.code||e.message)));

let uid = null, me = {}, others = {}, watching = {}, reqs = {}, subs = [];

/* ---------- लॉगिन / साइनअप ---------- */
$("loginBtn").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch(e){ alert(errMsg(e)); }
};
$("signupBtn").onclick = async () => {
  const name = $("nm").value.trim();
  if(!name){ alert("Please enter your name first"); return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value);
    const id = cred.user.uid;
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code, taken = true;
    while(taken){
      code = Array.from({length:6}, () => chars[Math.floor(Math.random()*chars.length)]).join("");
      taken = (await get(ref(db, "codes/"+code))).exists();
    }
    await set(ref(db, "codes/"+code), id);
    await set(ref(db, "users/"+id), {name, code, status:"", updated:0});
  } catch(e){ alert(errMsg(e)); }
};
$("outBtn").onclick = () => signOut(auth);

/* ---------- मेरा स्टेटस ---------- */
function drawMe(){
  $("myName").textContent = me.name || "";
  $("myCircle").innerHTML = avatar(me);
  $("myCode").textContent = me.code || "------";
  const b = $("myBubble");
  const st = live(me);
  b.textContent = st || (me.status ? "Status ended" : "Write your status below");
  b.className = "bubble" + (st ? "" : " empty");
  $("myTime").textContent = ago(me.updated);
}
async function saveStatus(text){
  try {
    const mins = +$("dur").value;
    await update(ref(db, "users/"+uid), {status:text.trim(), updated:Date.now(), expires: mins ? Date.now()+mins*60000 : 0});
    $("st").value = "";
  } catch(e){ alert(errMsg(e)); }
}
$("saveBtn").onclick = () => saveStatus($("st").value);

$("myCircle").onclick = () => $("pf").click();
$("pf").onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const img = new Image();
  img.onload = async () => {
    const c = document.createElement("canvas");
    c.width = c.height = 150;
    const s = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 150, 150);
    URL.revokeObjectURL(img.src);
    try { await update(ref(db, "users/"+uid), {photo: c.toDataURL("image/jpeg", 0.7)}); }
    catch(err){ alert(errMsg(err)); }
  };
  img.onerror = () => alert("Could not read this photo");
  img.src = URL.createObjectURL(f);
  e.target.value = "";
};
$("chips").innerHTML = QUICK.map(q => `<span>${esc(q)}</span>`).join("");
$("chips").onclick = e => { if(e.target.tagName === "SPAN") saveStatus(e.target.textContent); };

/* ---------- दूसरों का स्टेटस ---------- */
function drawOthers(){
  const ids = Object.keys(others).sort((a,b) => (others[b].updated||0) - (others[a].updated||0));
  $("others").innerHTML = ids.length
    ? "<h2>Everyone's status</h2>" + ids.map(id => {
        const o = others[id], st = live(o);
        return `<div class="row">
          <div class="circle sm">${avatar(o)}</div>
          <div class="info">
            <div class="n">${esc(o.name)}</div>
            <div class="s${st ? "" : " empty"}">${esc(st || (o.status ? "Status ended" : "No status yet"))}</div>
            <div class="t">${esc(ago(o.updated))}</div>
          </div>
          <button class="ghost" data-id="${esc(id)}">Remove</button></div>`;
      }).join("")
    : "";
}
$("others").onclick = async e => {
  const b = e.target.closest("button");
  if(!b) return;
  const id = b.dataset.id, o = others[id] || {};
  if(!confirm("Remove " + (o.name || "this person") + "? You will stop seeing each other's status.")) return;
  try {
    await remove(ref(db, "shares/"+uid+"/"+id));
    await remove(ref(db, "shares/"+id+"/"+uid));
  } catch(err){ alert(errMsg(err)); }
};
$("addBtn").onclick = async () => {
  const code = $("fc").value.trim().toUpperCase();
  if(code.length !== 6){ alert("Enter the 6-character code"); return; }
  try {
    const snap = await get(ref(db, "codes/"+code));
    if(!snap.exists()){ alert("Code not found"); return; }
    const friend = snap.val();
    if(friend === uid){ alert("That is your own code"); return; }
    await set(ref(db, "requests/"+friend+"/"+uid), {name: me.name || "Someone", time: Date.now()});
    $("fc").value = "";
    alert("Request sent! Once they approve, you will see each other's status.");
  } catch(e){ alert(errMsg(e)); }
};

/* ---------- लॉगिन स्टेट ---------- */
function drawRequests(){
  $("requests").innerHTML = Object.keys(reqs).map(id =>
    `<div class="req"><div><b>${esc(reqs[id].name)}</b> wants to connect. You will see each other's status.</div>
     <div class="btns"><button data-a="ok" data-id="${esc(id)}">Approve</button><button class="ghost" data-a="no" data-id="${esc(id)}">Reject</button></div></div>`
  ).join("");
}
$("requests").onclick = async e => {
  const b = e.target.closest("button");
  if(!b) return;
  const id = b.dataset.id;
  try {
    if(b.dataset.a === "ok"){
      await set(ref(db, "shares/"+uid+"/"+id), true);
      await set(ref(db, "shares/"+id+"/"+uid), true);
    }
    await remove(ref(db, "requests/"+uid+"/"+id));
  } catch(err){ alert(errMsg(err)); }
};

onAuthStateChanged(auth, user => {
  subs.forEach(f => f()); subs = [];
  Object.values(watching).forEach(f => f());
  me = {}; others = {}; watching = {}; reqs = {};
  uid = user ? user.uid : null;
  $("loginView").classList.toggle("hide", !!user);
  $("mainView").classList.toggle("hide", !user);
  if(!user){ drawOthers(); drawRequests(); return; }
  subs.push(onValue(ref(db, "users/"+uid), s => { me = s.val() || {}; drawMe(); }));
  subs.push(onValue(ref(db, "requests/"+uid), s => { reqs = s.val() || {}; drawRequests(); }));
  subs.push(onValue(ref(db, "shares/"+uid), s => {
    const owners = Object.keys(s.val() || {});
    owners.forEach(o => {
      if(watching[o]) return;
      watching[o] = onValue(ref(db, "users/"+o), x => { if(x.val()){ others[o] = x.val(); drawOthers(); } });
    });
    Object.keys(watching).forEach(o => {
      if(!owners.includes(o)){ watching[o](); delete watching[o]; delete others[o]; }
    });
    drawOthers();
  }));
});
setInterval(() => { drawMe(); drawOthers(); }, 60000);
</script>
</body>
</html>
